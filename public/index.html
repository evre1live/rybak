<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#15161a">
<title>Рыбак — рыбалка с друзьями</title>
<meta name="description" content="Рыбалка с друзьями от первого лица: голосовой чат, рынок, снасти и свой персонаж.">
<meta property="og:title" content="Рыбак — рыбалка с друзьями">
<meta property="og:description" content="Заходи в бухту: поболтаем и порыбачим.">
<link rel="icon" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Рыбак">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view"></canvas>
<div id="boot"><div class="bt">РЫБАК</div><div class="bbar"><i id="bootFill"></i></div><div class="bs" id="bootTxt">Строим бухту…</div></div>
<div id="ui">
  <div id="hud" class="hidden">
    <div class="hud-tl">
      <div class="place"><span class="ic" data-ic="pin"></span><div><h1 id="placeName">Солнечная бухта</h1><div class="loc"><b id="clock">08:00</b><i class="dot"></i><span class="ic" id="wxIc" data-ic="sun"></span><span id="wxName">Ясно</span></div></div></div>
      <div id="quests" class="hidden"></div>
      <div id="feed"></div>
    </div>
    <div class="hud-tc"><canvas id="compass" width="760" height="64"></canvas><div id="banner" class="hidden"></div><div id="tour" class="hidden"></div></div>
    <div class="hud-tr">
      <div class="cap" id="locName">Бухта</div>
      <div class="mapbox"><canvas id="minimap" width="512" height="276"></canvas><b class="dist hidden" id="mapDist"></b><span class="north">С</span></div>
      <div class="crewbox gl">
        <div class="ch"><span class="cap" id="onlineN">Одиночная рыбалка</span></div>
        <div id="crew"></div>
        <div class="voice click hidden" id="voiceChip"><span class="ic" data-ic="mic"></span><b id="voiceTxt">Голос</b></div>
      </div>
      <div class="purse gl"><span class="ic" data-ic="coin"></span><b id="coins">0</b><i class="sep"></i><span class="lv">ур.</span><b id="lvl">1</b></div>
    </div>
    <div class="hud-bl">
      <div class="tally"><span class="seg bag"><span class="ic" data-ic="bag"></span><b id="bagN">0 / 8</b></span><i class="sep"></i><span class="seg bait click" data-k="bait"><img id="baitIcon" alt=""><b id="baitN">0</b></span></div>
    </div>
    <div class="hud-bc">
      <div id="fight" class="hidden">
        <div id="steer">
          <span class="st l"><kbd>A</kbd><i>◀</i></span>
          <div class="fpanel gl">
            <div class="fhead"><span class="cap">Натяжение лески</span><b id="fstate">РОВНО</b></div>
            <div class="tline"><span class="lb">Слабо</span><div class="tbar" id="tbar"><span class="lo">СЛАБО</span><span class="ok" id="tok">НОРМА</span><span class="dg">ОПАСНО</span><div class="tz slack">ВЯЛО</div><div class="tz lift" id="tzLift"><i id="tzLiftK"></i><b>ДЕРЖИ</b></div><div class="tz jump" id="tzJump">ОСЛАБЬ</div><div id="tptr"></div></div><span class="lb">Сильно</span></div>
            <div class="prow"><span class="cap">Улов</span><b id="ppct">0%</b><b id="fboss"></b><div class="pbar" id="pbar"><i id="pfill"></i><em class="pm" style="left:45%"></em><em class="pm" style="left:80%"></em><em class="pn" style="left:70%"></em></div></div>
            <div id="ftip"></div>
          </div>
          <span class="st r"><i>▶</i><kbd>D</kbd></span>
        </div>
      </div>
      <div id="power" class="hidden"><span class="cap">Сила заброса</span><div class="pw"><i id="pwfill"></i><em id="pwneed"></em></div></div>
    </div>
    <div class="hud-br"><div id="hints"></div><div id="hotbar"></div></div>
    <div id="cross"><i></i></div>
    <div id="castMark" class="hidden"><div class="ring"></div><div class="lbl">ЗАБРОС СЮДА</div><div class="sub"></div><div class="who"></div></div>
    <div id="prompt" class="hidden"></div>
    <div id="alert" class="hidden"></div>
    <div id="tags"></div>
    <div id="catch" class="hidden"></div>
    <form id="chat" class="hidden" autocomplete="off"><input id="chatIn" maxlength="200" placeholder="Сообщение друзьям — Enter"></form>
  </div>
  <div id="plates"></div>
  <div id="screen"></div>
  <div id="toasts"></div>
  <div id="touch" class="hidden">
    <div id="stick"><i></i></div>
    <button id="tAct" type="button">ЗАБРОС</button>
    <button id="tR" type="button" class="pill hidden">СМОТАТЬ</button>
    <button id="tE" type="button" class="pill ye hidden">РЫНОК</button>
    <button id="tP" type="button" class="pill hidden">ОТКРЫТКА</button>
    <button id="tSit" type="button" class="pill">СЕСТЬ</button>
    <button id="tChat" type="button" class="hidden" aria-label="Чат"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg></button>
    <button id="tMenu" type="button" aria-label="Меню">☰</button>
  </div>
  <div id="rotate"><svg viewBox="0 0 64 64" width="64" height="64"><rect x="20" y="6" width="24" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="4"/><path d="M8 40a26 26 0 0 0 22 18m-4-7 5 7-8 3" fill="none" stroke="#ffd60a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><b>ПОВЕРНИТЕ ТЕЛЕФОН</b><p>Рыбачить удобнее, когда экран лежит на боку.</p><button type="button" class="btn ghost"><span>ИГРАТЬ ТАК</span></button></div>
  <div id="loading"><div class="logo"><span class="palm"></span>РЫБАК</div><p>Готовим снасти…</p></div>
</div>
<script src="app.js"></script>
</body>
</html>
