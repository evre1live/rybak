# Инфраструктура игры на Render: сервер и база данных.
# Строку подключения к базе Render подставляет серверу сам (fromDatabase) — её нет ни в коде, ни в настройках вручную.
databases:
  - name: rybak-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "18"
    diskSizeGB: 1
    databaseName: rybak
    user: rybak

services:
  - type: web
    name: rybak
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    staticPublishPath: public # как у сервиса сейчас; серверу не нужен (файлы отдаёт сам), но так описание совпадает с тем, что есть
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rybak-db
          property: connectionString
