# Инфраструктура игры на Render: сервер и база данных.
# Строку подключения к базе Render подставляет серверу сам (fromDatabase) — её нет ни в коде, ни в настройках вручную.
databases:
  - name: rybak-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "18"
    diskSizeGB: 1
    databaseName: rybak
    user: rybak

services:
  - type: web
    name: rybak
    runtime: node
    # Starter: сервер не засыпает без посетителей (на бесплатном тарифе — через 15 минут, и первый вход потом ждёт до минуты)
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    # node напрямую, без npm: сигнал остановки при выкладке доходит до сервера, и он успевает записать комнаты в базу
    startCommand: node server/index.js
    # новая версия получает посетителей, только когда уже отвечает
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rybak-db
          property: connectionString
